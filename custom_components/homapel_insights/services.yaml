upload_test_signal:
  name: Upload test observation
  description: >-
    End-to-end verification — craft and upload one synthetic ObservationWindow
    (a device left on while away, with energy) to the cloud and deliver any
    returned suggestions as notifications.
  fields:
    entity_id:
      name: Entity
      description: Entity the synthetic observation is about.
      example: climate.salon
      selector:
        text:
    area_id:
      name: Area
      description: Optional area id for the observation.
      example: salon
      selector:
        text:
    energy_kwh:
      name: Energy (kWh)
      description: Total energy to attach to the observation.
      example: 3.2
      selector:
        number:
          min: 0
          step: 0.1
          mode: box
    duration_s:
      name: On duration (seconds)
      description: Length of the synthetic on-event (tagged manual + away).
      example: 28800
      selector:
        number:
          min: 0
          mode: box

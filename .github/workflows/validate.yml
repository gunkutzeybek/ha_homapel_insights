name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  pytest:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component 0.13.316 pins HA 2026.2.3
          # (Python 3.13). Home Assistant needs a POSIX host, so this job cannot
          # run on windows-latest.
          python-version: "3.13"
          cache: pip

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
